<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin — Phoenix Thozha Gifts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap nav">
      <a class="logo" href="index.html"><img class="logo-mark" src="images/phoenix-logo.jpg" alt="Phoenix Thozha" /><span class="logo-text">Phoenix Thozha<em>Gifts</em></span></a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a class="active" href="admin.html">Admin</a>
        <a class="cart-link" href="cart.html">Cart <span class="badge" data-cart-count hidden>0</span></a>
      </nav>
    </div>
  </header>

  <main class="wrap section">
    <div id="admin-lock" style="max-width:420px; margin:40px auto 0;">
      <p class="kicker">Admin</p>
      <h1>Enter password</h1>
      <form class="form" id="admin-login-form">
        <label>Password<input type="password" id="admin-password" required placeholder="Enter admin password" /></label>
        <button class="btn btn-primary" type="submit">Unlock admin</button>
        <p class="muted" id="login-error"></p>
      </form>
    </div>

    <div id="admin-content" style="display:none;">
      <p class="kicker">Admin</p>
      <h1>Manage products</h1>
      <p class="muted">Only add and delete product actions are allowed here.</p>
      <div class="split" style="align-items:start">
        <form class="form" id="product-form">
          <label>Product name<input name="name" required /></label>
          <label>Category<input name="category" required /></label>
          <label>Price<input name="price" type="number" min="1" required /></label>
          <label>Tag<input name="tag" placeholder="Bestseller / New" /></label>
          <label>Short message<input name="blurb" required /></label>
          <label>Image file<input type="file" id="image-file" accept="image/*" /></label>
          <button class="btn btn-primary" type="submit">Add product</button>
        </form>

        <div>
          <h2>Current products</h2>
          <div id="admin-list" class="cart-table"></div>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap"><p>Phoenix Thozha Gifts · Veedur, Villupuram · +91 86675 17337</p></div>
  </footer>

  <a class="whatsapp-float" href="https://wa.me/918667517337" target="_blank" aria-label="Chat on WhatsApp">✆</a>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script>
    const ADMIN_PASSWORD = "Pri250305@";
    const list = document.getElementById("admin-list");
    const form = document.getElementById("product-form");
    const lockView = document.getElementById("admin-lock");
    const contentView = document.getElementById("admin-content");
    const loginForm = document.getElementById("admin-login-form");
    const loginError = document.getElementById("login-error");
    const imageFileInput = document.getElementById("image-file");

    function readFileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error("Could not read file"));
        reader.readAsDataURL(file);
      });
    }

    function unlockAdmin() {
      lockView.style.display = "none";
      contentView.style.display = "block";
      renderAdminList();
    }

    function renderAdminList() {
      const products = getProducts();
      list.innerHTML = products.map((product) => `
        <article class="cart-row" style="grid-template-columns: 1fr auto;">
          <div>
            <strong>${product.name}</strong>
            <div class="muted">${product.category} · ₹${product.price}</div>
          </div>
          <button class="btn btn-ghost" data-delete="${product.id}" style="padding:6px 12px">Delete</button>
        </article>
      `).join("");

      list.querySelectorAll("[data-delete]").forEach((btn) => {
        btn.onclick = () => {
          const next = getProducts().filter((item) => item.id !== btn.dataset.delete);
          saveProducts(next);
          renderAdminList();
        };
      });
    }

    loginForm.onsubmit = (e) => {
      e.preventDefault();
      const password = document.getElementById("admin-password").value;

      if (password === ADMIN_PASSWORD) {
        loginError.textContent = "";
        unlockAdmin();
      } else {
        loginError.textContent = "Incorrect password";
      }
    };

    form.onsubmit = async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target));
      const name = (data.name || "").trim();
      const category = (data.category || "").trim();
      const price = Number(data.price);
      const blurb = (data.blurb || "").trim();
      const file = imageFileInput.files[0];

      if (!name || !category || !price || !blurb) {
        return;
      }

      let image = "images/mug.jpg";
      if (file) {
        try {
          image = await readFileAsDataUrl(file);
        } catch {
          alert("Image upload failed. Please try another file.");
          return;
        }
      }

      const product = {
        id: name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "product",
        name,
        category,
        price,
        tag: (data.tag || "").trim(),
        blurb,
        description: blurb,
        colors: ["Default"],
        options: ["name", "message"],
        image,
      };

      const items = getProducts();
      const duplicate = items.some((item) => item.id === product.id);
      if (duplicate) {
        alert("A product with this name already exists. Please use a different product name.");
        return;
      }

      items.push(product);
      saveProducts(items);
      form.reset();
      imageFileInput.value = "";
      renderAdminList();
    };
  </script>
</body>
</html>
